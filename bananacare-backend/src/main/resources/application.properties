spring.application.name=BananaCare
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# BANANACARE CUSTOM CONFIGURATION
# ===============================

# Allowed CORS origins
bananacare.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Python AI Service URL
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}


# ===============================
# JWT Configuration
# ===============================

jwt.secret=${JWT_SECRET:BananaCareDevelopmentSecretKey2026MustBeAtLeast32CharactersLong}
jwt.expiration=86400000

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB